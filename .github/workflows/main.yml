name: scrape

on:
  schedule:
    - cron: "40 18 * * *"   # 00:10 IST
    - cron: "30 0 * * *"    # 06:00 IST retry
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install browser
        run: |
          scrapling install
          patchright install chromium

      - name: Scrape
        run: python scraper.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data $(TZ=Asia/Kolkata date +%F)"
            git pull --rebase
            git push
          fi
